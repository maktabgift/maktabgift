<body>
  <div id="root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
  (() => {
    'use strict';

    // ===== Curriculum and grade helpers =====
    const GRADES=Array.from({length:11},(_,i)=>i+1);
    const CURRICULUM_SEED={
      1:['Ona tili','Matematika','Tabiatshunoslik','Tasviriy san’at','Musiqa','Jismoniy tarbiya','Texnologiya','Informatika va axborot texnologiyalari'],
      2:['Ona tili','Matematika','Tabiatshunoslik','Tasviriy san’at','Musiqa','Jismoniy tarbiya','Texnologiya','Informatika va axborot texnologiyalari','Ingliz tili'],
      3:['Ona tili','Matematika','Tabiatshunoslik','Tasviriy san’at','Musiqa','Jismoniy tarbiya','Texnologiya','Informatika va axborot texnologiyalari','Ingliz tili'],
      4:['Ona tili','Matematika','Tabiatshunoslik','Tasviriy san’at','Musiqa','Jismoniy tarbiya','Texnologiya','Informatika va axborot texnologiyalari','Ingliz tili'],
      5:['Ona tili','Adabiyot','Matematika','O‘zbekiston tarixi','Jahon tarixi','Biologiya','Geografiya','Informatika','Ingliz tili','Rus tili','Tasviriy san’at','Musiqa','Jismoniy tarbiya','Texnologiya'],
      6:['Ona tili','Adabiyot','Matematika','O‘zbekiston tarixi','Jahon tarixi','Biologiya','Geografiya','Informatika','Ingliz tili','Rus tili','Tasviriy san’at','Musiqa','Jismoniy tarbiya','Texnologiya'],
      7:['Ona tili','Adabiyot','Matematika','Algebra','Geometriya','O‘zbekiston tarixi','Jahon tarixi','Biologiya','Geografiya','Fizika','Informatika','Ingliz tili','Rus tili','Tasviriy san’at','Musiqa','Jismoniy tarbiya','Texnologiya','Chizmachilik'],
      8:['Ona tili','Adabiyot','Matematika','Algebra','Geometriya','O‘zbekiston tarixi','Jahon tarixi','Biologiya','Geografiya','Fizika','Kimyo','Informatika','Ingliz tili','Rus tili','Tasviriy san’at','Musiqa','Jismoniy tarbiya','Texnologiya','Chizmachilik','Hayot faoliyati xavfsizligi'],
      9:['Ona tili','Adabiyot','Matematika','Algebra','Geometriya','O‘zbekiston tarixi','Jahon tarixi','Biologiya','Geografiya','Fizika','Kimyo','Informatika','Ingliz tili','Rus tili','Tasviriy san’at','Musiqa','Jismoniy tarbiya','Texnologiya','Chizmachilik','Hayot faoliyati xavfsizligi','Huquq asoslari'],
      10:['Ona tili va adabiyot','Matematika','Ingliz tili','Rus tili','O‘zbekiston tarixi','Jahon tarixi','Biologiya','Kimyo','Fizika','Geografiya','Informatika','Huquq asoslari','Jismoniy tarbiya','Hayot faoliyati xavfsizligi','Ixtisoslik fan (tanlov)'],
      11:['Ona tili va adabiyot','Matematika','Ingliz tili','Rus tili','O‘zbekiston tarixi','Jahon tarixi','Biologiya','Kimyo','Fizika','Geografiya','Informatika','Huquq asoslari','Jismoniy tarbiya','Hayot faoliyati xavfsizligi','Ixtisoslik fan (tanlov)']
    };
    function subjectIdForName(name){return `subject-${String(name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('uz').replace(/[’‘ʻ`']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}`}
    function defaultSubjectNames(){return [...new Set(['Matematika','Ona tili','Adabiyot','Ingliz tili','Tarix','Biologiya',...Object.values(CURRICULUM_SEED).flat()])];}
    const STANDARD_SECTIONS=['A','B','D','E'];
    function parseClassIdentity(name){const value=String(name||'').trim(),match=value.match(/^\s*(\d{1,2})\s*[-–]\s*(.{1,10}?)\s*$/u);if(match)return {grade:Number(match[1]),section:match[2].trim()};const compact=value.match(/^\s*(\d{1,2})\s*([A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ]{1,10})\s*$/u);if(compact)return {grade:Number(compact[1]),section:compact[2].trim()};const prefix=value.match(/^\s*(\d{1,2})\s+(.{1,10}?)\s*$/u);return prefix?{grade:Number(prefix[1]),section:prefix[2].trim()}:null}
    function defaultClasses(){return GRADES.flatMap(grade=>STANDARD_SECTIONS.map(section=>({id:`class-${grade}-${section.toLowerCase()}`,name:`${grade}-${section}`,grade,section})));}
    function seedProvisionalCurriculum(data){const byName=new Map(data.subjects.map(name=>[name.toLocaleLowerCase('uz'),name]));const rows=[];for(const grade of GRADES)for(const seedName of CURRICULUM_SEED[grade]){let subject=byName.get(seedName.toLocaleLowerCase('uz'));if(!subject){subject=seedName;data.subjects.push(subject);byName.set(subject.toLocaleLowerCase('uz'),subject)}rows.push({id:id('curriculum'),grade,subjectId:subjectIdForName(subject),weeklyHours:null})}return rows;}
    function migrateData(data){
      if(!data||typeof data!=='object')throw new Error('Saqlangan ma’lumotlar noto‘g‘ri.');
      data.version=1;
      data.settings=data.settings||{weights:{avgMultiplier:20,unexcusedAbsencePenalty:3,skippedLessonPenalty:2},gradeMin:2,gradeMax:5,lessonsPerDay:7,showRankingToStudents:false};
      data.settings.weights=data.settings.weights||{avgMultiplier:20,unexcusedAbsencePenalty:3,skippedLessonPenalty:2};
      if(data.settings.gradeMin==null)data.settings.gradeMin=2;if(data.settings.gradeMax==null)data.settings.gradeMax=5;if(data.settings.lessonsPerDay==null)data.settings.lessonsPerDay=7;if(data.settings.showRankingToStudents==null)data.settings.showRankingToStudents=false;
      data.auth=data.auth||{};data.auth.teacherUsername=data.auth.teacherUsername||'teacher';
      data.classes=Array.isArray(data.classes)?data.classes:[];

    function calculateRatings(db,start){
      const {from,to}=dataRangeDates(start),w=db.settings.weights;
      const rows=db.students.map(student=>{
        const grades=db.grades.filter(g=>g.studentId===student.id&&g.date>=from&&g.date<=to).map(g=>Number(g.value));
        const avg=grades.length?grades.reduce((a,b)=>a+b,0)/grades.length:null;
        const days=db.attendance.filter(a=>a.studentId===student.id&&a.date>=from&&a.date<=to);
        const unexcusedDays=days.filter(a=>a.status==='unexcused').length;
        const skipped=days.reduce((n,a)=>n+(Number(a.skippedLessons)||0),0);
        // Tekshiruv misoli: 4.5*20 - 1*3 - 2*2 = 83 ball.
        const score=Math.round((((avg??0)*w.avgMultiplier-unexcusedDays*w.unexcusedAbsencePenalty-skipped*w.skippedLessonPenalty)+Number.EPSILON)*100)/100;
        return {studentId:student.id,fullName:student.fullName,avg,unexcusedDays,skipped,score};
      });
      rows.sort((a,b)=>b.score-a.score||((b.avg??-Infinity)-(a.avg??-Infinity))||a.fullName.localeCompare(b.fullName,'uz'));

    function subjectUsageIn(data,name){const subjectId=subjectIdForName(name);return {grades:data.grades.filter(g=>g.subject===name).length,schedule:data.timetable.filter(row=>row.subjectId===subjectId).length,curriculum:data.curriculum.filter(row=>row.subjectId===subjectId).length}}

    function developerOverviewView(){return `${pageHead('Dasturchi oynasi','Sinflar, fanlar, o‘quv reja va dars jadvalini boshqaring.')}<div class="grid"><div class="grid grid-4"><div class="card stat"><div class="stat-label">Sinflar</div><div class="stat-value">${state.db.classes.length}</div><div class="stat-note">1–11-sinflar va parallel guruhlar</div><div class="stat-icon">▦</div></div><div class="card stat"><div class="stat-label">Fanlar</div><div class="stat-value">${state.db.subjects.length}</div><div class="stat-note">tahrirlash va jadvalga biriktirish</div><div class="stat-icon">▤</div></div><div class="card stat"><div class="stat-label">O‘quv reja</div><div class="stat-value">${state.db.curriculum.length}</div><div class="stat-note">fan-sinf birikmalari</div><div class="stat-icon">▥</div></div><div class="card stat"><div class="stat-label">Dars jadvali</div><div class="stat-value">${state.db.timetable.length}</div><div class="stat-note">saqlangan darslar</div><div class="stat-icon">◷</div></div></div><section class="card"><div class="card-head"><div><h3 class="section-title">Boshlash</h3><p class="section-sub">Taxminiy o‘quv rejani rasmiy tayanch reja bilan almashtiring.</p></div></div><div class="card-body quick-list"><div class="banner banner-warn"><span>!</span><div><strong>${state.db.curriculumConfirmed?'O‘quv reja saqlandi':'Taxminiy ma’lumot'}</strong>${state.db.curriculumConfirmed?'Jadval dasturchi tomonidan saqlangan.':'Boshlang‘ich soatlar rasmiy reja bilan tasdiqlanmagan.'}</div></div><button class="btn btn-light" data-action="navigate" data-view="curriculum">O‘quv rejani ochish</button></div></section></div>`}
    function classForm(){const current=state.editClassId?classById(state.editClassId):null;if(!state.classFormOpen&&!current)return '';return `<section class="card"><div class="card-head"><div><h3 class="section-title">${current?'Sinfni tahrirlash':'Yangi sinf qo‘shish'}</h3><p class="section-sub">Sinf darajasi va harfini yoki nomini kiriting.</p></div><button class="btn btn-light btn-sm" data-action="cancel-class-form">Yopish</button></div><div class="card-body"><form data-form="class"><input type="hidden" name="id" value="${esc(current?.id||'')}"><div class="form-grid"><div class="field"><label>Daraja</label><select name="grade">${GRADES.map(g=>`<option value="${g}" ${Number(current?.grade||5)===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label>Harf yoki nom</label><input name="section" maxlength="10" value="${esc(current?.section||'') }" placeholder="B" required></div></div>${current?'':`<p><label><input type="checkbox" name="autoTimetable" ${state.classAutoTimetable?'checked':''}> Dars jadvalini avtomatik tuzish</label></p>`}<div class="form-actions"><button class="btn">${current?'O‘zgarishlarni saqlash':'Sinf qo‘shish'}</button></div></form></div></section>`}
    function classesView(){const classRows=GRADES.map(grade=>{const group=state.db.classes.filter(item=>Number(item.grade)===grade).sort((a,b)=>String(a.section).localeCompare(String(b.section),'uz')||a.name.localeCompare(b.name,'uz'));return `<tr><th colspan="5">${grade}-sinf</th></tr>${group.map(c=>{const students=state.db.students.filter(s=>s.classId===c.id).length,lessons=state.db.timetable.filter(row=>row.classId===c.id).length;return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.section)}</td><td>${students}</td><td>${lessons}</td><td><button class="btn btn-light btn-sm" data-action="edit-class" data-id="${esc(c.id)}">Tahrirlash</button> <button class="btn btn-warn btn-sm" data-action="delete-class" data-id="${esc(c.id)}">O‘chirish</button></td></tr>`}).join('')}`}).join('');return `${pageHead('Sinflar','1–11-darajalar va sinf guruhlarini boshqaring.',`<div class="page-actions"><button class="btn btn-light" data-action="add-standard-sections">Har bir darajaga A, B, D, E qo‘shish</button><button class="btn" data-action="add-class">＋ Sinf qo‘shish</button></div>`)}<div class="grid">${classForm()}<section class="card"><div class="card-head"><div><h3 class="section-title">Sinf ro‘yxati</h3><p class="section-sub">O‘quvchilar va jadvaldagi darslar soni sinf bo‘yicha ko‘rsatiladi.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Sinf</th><th>Harf yoki nom</th><th>O‘quvchilar</th><th>Jadval darslari</th><th>Amallar</th></tr></thead><tbody>${classRows}</tbody></table></div></section></div>`}
    function subjectForm(){if(!state.subjectFormOpen&&!state.editSubject)return '';return `<section class="card"><div class="card-head"><div><h3 class="section-title">${state.editSubject?'Fanni nomlash':'Yangi fan'}</h3><p class="section-sub">Nom o‘zgartirilganda mavjud bog‘lanishlar saqlanadi.</p></div><button class="btn btn-light btn-sm" data-action="cancel-subject-form">Yopish</button></div><div class="card-body"><form data-form="subject"><input type="hidden" name="oldName" value="${esc(state.editSubject||'')}"><div class="form-grid"><div class="field"><label>Fan nomi</label><input name="name" maxlength="90" value="${esc(state.editSubject||'')}" required></div></div><div class="form-actions"><button class="btn">${state.editSubject?'Nomni saqlash':'Fan qo‘shish'}</button></div></form></div></section>`}
    function subjectsView(){const names=[...state.db.subjects].sort((a,b)=>a.localeCompare(b,'uz'));return `${pageHead('Fanlar','Fan nomlarini va ulardan foydalaniladigan joylarni boshqaring.',`<button class="btn" data-action="add-subject">＋ Fan qo‘shish</button>`)}<div class="grid">${subjectForm()}<section class="card"><div class="card-head"><div><h3 class="section-title">Fanlar ro‘yxati</h3><p class="section-sub">Ishlatilayotgan fanlarni o‘chirish mumkin emas; har bir qatorda foydalanish soni ko‘rsatiladi.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Fan nomi</th><th>Rejadagi sinflar</th><th>Jadvaldagi darslar</th><th>Baholar</th><th>Jami foydalanish</th><th>Amallar</th></tr></thead><tbody>${names.map(name=>{const u=subjectUsage(name),total=usageCount(u);return `<tr><td><b>${esc(name)}</b></td><td>${u.curriculum}</td><td>${u.schedule}</td><td>${u.grades}</td><td>${total}</td><td><button class="btn btn-light btn-sm" data-action="edit-subject" data-name="${esc(name)}">Tahrirlash</button> <button class="btn btn-warn btn-sm" data-action="delete-subject" data-name="${esc(name)}">O‘chirish</button></td></tr>`}).join('')}</tbody></table></div></section></div>`}

      const editForm=editor?`<div class="card-body" style="border-bottom:1px solid var(--line);background:#f9fbfc"><form id="edit-grade-form" data-form="edit-grade"><input type="hidden" name="id" value="${esc(editor.id)}"><div class="form-grid"><div class="field"><label>O‘quvchi</label><select name="studentId">${state.db.students.map(s=>`<option value="${esc(s.id)}" ${s.id===editor.studentId?'selected':''}>${esc(s.fullName)}</option>`).join('')}</select></div><div class="field"><label>Fan</label><select name="subject">${state.db.subjects.map(s=>`<option ${s===editor.subject?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Sana</label><input type="date" name="date" value="${esc(editor.date)}" required></div><div class="field"><label>Baho</label><input type="number" name="value" min="${state.db.settings.gradeMin}" max="${state.db.settings.gradeMax}" value="${esc(editor.value)}" required></div><div class="field" style="grid-column:span 2"><label>Izoh</label><input name="comment" maxlength="180" value="${esc(editor.comment||'')}"></div></div><div class="form-actions"><button class="btn btn-sm">Saqlash</button><button type="button" class="btn btn-light btn-sm" data-action="cancel-grade-edit">Bekor qilish</button></div></form></div>`:'';
      return `<section class="card" style="margin-top:16px"><div class="card-head"><div><h3 class="section-title">Kiritilgan baholar</h3><p class="section-sub">Filtrlang, tahrirlang yoki o‘chiring.</p></div><span class="pill pill-neutral">${grades.length} ta</span></div>${editForm}<div class="card-body"><form id="grade-filter-form" class="filter-row"><div class="field"><label for="filter-student">O‘quvchi</label><select id="filter-student" name="student"><option value="">Barchasi</option>${state.db.students.map(s=>`<option value="${esc(s.id)}" ${f.student===s.id?'selected':''}>${esc(s.fullName)}</option>`).join('')}</select></div><div class="field"><label for="filter-subject">Fan</label><select id="filter-subject" name="subject"><option value="">Barchasi</option>${state.db.subjects.map(s=>`<option ${f.subject===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label for="filter-from">Dan</label><input id="filter-from" type="date" name="from" value="${esc(f.from)}"></div><div class="field"><label for="filter-to">Gacha</label><input id="filter-to" type="date" name="to" value="${esc(f.to)}"></div><button class="btn btn-light btn-sm">Filtrlash</button><button class="btn btn-light btn-sm" type="button" data-action="clear-grade-filters">Tozalash</button></form></div>${grades.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Sana</th><th>O‘quvchi</th><th>Fan</th><th>Baho</th><th>Izoh</th><th>Amallar</th></tr></thead><tbody>${grades.map(g=>`<tr><td>${prettyDate(g.date)}</td><td>${esc(byStudent(g.studentId)?.fullName||'O‘chirilgan o‘quvchi')}</td><td>${esc(g.subject)}</td><td><b>${esc(g.value)}</b></td><td>${esc(g.comment||'—')}</td><td><button class="btn btn-light btn-sm" data-action="edit-grade" data-id="${esc(g.id)}">Tahrirlash</button> <button class="btn btn-warn btn-sm" data-action="delete-grade" data-id="${esc(g.id)}">O‘chirish</button></td></tr>`).join('')}</tbody></table></div>`:emptyBlock('Baholar topilmadi','Tanlangan filtrga mos baholar mavjud emas.')}</section>`;
    }
    function gradesView(){return `${pageHead('Baholar','Fan va sana bo‘yicha baholarni tez kiriting yoki mavjud yozuvlarni tahrirlang.')}${gradeQuickForm()}${gradeList()}`}
    function curriculumBanner(){return `<div class="banner banner-info"><span>i</span><div>Ma’lumotlar Maktabgacha va maktab ta’limi vazirligining tayanch o‘quv rejasiga asosan to‘ldiriladi. Ayrim sinflarda soatlar farq qilishi mumkin.</div>${state.db.curriculumConfirmed?'':'<span class="pill pill-excused">Taxminiy — tasdiqlash kerak</span>'}</div>`}
    function curriculumReadView(){
      const student=state.user.role==='student',studentClass=student?studentClassForView():null;
      const grade=student?Number(studentClass?.grade||1):Number(state.curriculumGrade||1);
      const entries=curriculumForGrade(grade).map(row=>({row,name:subjectNameById(row.subjectId)})).filter(x=>x.name).sort((a,b)=>a.name.localeCompare(b.name,'uz'));
      return `${curriculumBanner()}${pageHead('O‘quv reja',student?'Sinfingizda o‘tiladigan fanlar va haftalik soatlar.':'Tanlangan bosqich uchun o‘quv reja ma’lumotlari.')}<section class="card"><div class="card-head"><div><h3 class="section-title">${student?esc(studentClass?.name||'Sinf'):grade+'-sinf fanlari'}</h3><p class="section-sub">Bu oynada o‘quv reja faqat ko‘rish uchun.</p></div>${student?'':`<div class="field"><label for="read-curriculum-grade">Sinf bosqichi</label><select id="read-curriculum-grade">${GRADES.map(g=>`<option value="${g}" ${g===grade?'selected':''}>${g}-sinf</option>`).join('')}</select></div>`}</div>${entries.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Fan</th><th>Haftalik soat</th></tr></thead><tbody>${entries.map(({row,name})=>`<tr><td>${esc(name)}</td><td>${row.weeklyHours==null?'Ko‘rsatilmagan':`${row.weeklyHours} soat`}</td></tr>`).join('')}</tbody></table></div>`:emptyBlock('Bu sinf uchun fanlar belgilanmagan','Dasturchi o‘quv reja jadvalini yangilashi kerak.')}</section>`;

    function curriculumView(){
      if(state.user.role!=='developer')return curriculumReadView();
      const rows=state.db.subjects.map(name=>({name,subjectId:subjectIdForName(name)})).sort((a,b)=>a.name.localeCompare(b.name,'uz'));

    function groupedClassOptions(selected){return GRADES.map(grade=>{const group=state.db.classes.filter(klass=>Number(klass.grade)===grade).sort((a,b)=>String(a.section).localeCompare(String(b.section),'uz')||a.name.localeCompare(b.name,'uz'));return group.length?`<optgroup label="${grade}">${group.map(klass=>`<option value="${esc(klass.id)}" ${klass.id===selected?'selected':''}>${esc(klass.name)}</option>`).join('')}</optgroup>`:''}).join('')}
    function curriculumAllows(grade,subjectId){return curriculumForGrade(grade).some(row=>row.subjectId===subjectId)}
    function generateTimetable(grade,lessonsPerDay,curriculumRows,rng=Math.random){
      const rows=(Array.isArray(curriculumRows)?curriculumRows:[]).filter(row=>row.grade==null||Number(row.grade)===Number(grade)),bySubject=new Map();

      const usernames=new Set([d.auth.teacherUsername.toLowerCase(),d.auth.developerUsername.toLowerCase()]),studentIds=new Set();
      for(const s of d.students){if(!s.id||studentIds.has(s.id)||!s.fullName?.trim()||!s.username?.trim()||!/^([a-f0-9]{64})$/i.test(s.passwordHash||''))throw new Error('O‘quvchi yozuvi yoki parol xeshi noto‘g‘ri.');const u=s.username.toLowerCase();if(usernames.has(u))throw new Error(`Takrorlangan login: ${s.username}`);usernames.add(u);studentIds.add(s.id)}

      const attendanceKeys=new Set();for(const a of d.attendance){const key=`${a.studentId}|${a.date}`;if(!studentIds.has(a.studentId)||!isDate(a.date)||!['present','excused','unexcused'].includes(a.status)||!Number.isInteger(Number(a.skippedLessons))||Number(a.skippedLessons)<0||Number(a.skippedLessons)>lessons||attendanceKeys.has(key))throw new Error('Davomat qatorlaridan biri noto‘g‘ri yoki takrorlangan.');attendanceKeys.add(key)}

      return (async()=>{const hash=await Storage.hashPassword('demo123');for(const s of demoStudents)s.passwordHash=hash;state.db.students.push(...demoStudents);const subjects=state.db.subjects;for(const week of weeks){for(const s of demoStudents){for(let day=0;day<5;day++){const date=addDays(week,day);if(date>today)continue;const dice=rand(100),status=dice<89?'present':dice<96?'excused':'unexcused',skipped=rand(100)<12?1:0;state.db.attendance.push({studentId:s.id,date,status,skippedLessons:skipped})}for(let j=0;j<3;j++){const date=addDays(week,rand(5));if(date>today)continue;const raw=rand(100),value=raw<9?2:raw<34?3:raw<74?4:5;state.db.grades.push({id:id('grade'),studentId:s.id,subject:subjects[(j+rand(3))%subjects.length],value,date,comment:''})}}}await saveData(state.db);state.view='overview';render();notify('20 nafar demo o‘quvchi va namunaviy ma’lumot yaratildi.')})();
    }

    root.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;event.preventDefault();(async()=>{

      else if(action==='edit-timetable'){state.scheduleEditMode=true;render()}
      else if(action==='cancel-timetable-edit'){state.scheduleEditMode=false;render()}

      else if(action==='add-subject'){state.subjectFormOpen=true;state.editSubject=null;render()}
      else if(action==='cancel-subject-form'){state.subjectFormOpen=false;state.editSubject=null;render()}

      else if(action==='delete-student'){const s=byStudent(el.dataset.id);if(s&&confirm(`${s.fullName} va unga tegishli baho hamda davomat yozuvlarini o‘chirasizmi?`)){state.db.students=state.db.students.filter(x=>x.id!==s.id);state.db.attendance=state.db.attendance.filter(x=>x.studentId!==s.id);state.db.grades=state.db.grades.filter(x=>x.studentId!==s.id);await saveData(state.db);render();notify('O‘quvchi va unga tegishli yozuvlar o‘chirildi.')}}
      else if(action==='reset-student-password'){const s=byStudent(el.dataset.id);if(!s)return;const next=prompt(`${s.fullName} uchun yangi parol kiriting (kamida 4 belgi):`);if(next===null)return;if(next.length<4){notify('Parol kamida 4 ta belgidan iborat bo‘lsin.');return}if(confirm(`${s.fullName} parolini yangilaysizmi?`)){s.passwordHash=await Storage.hashPassword(next);await saveData(state.db);notify('O‘quvchi paroli yangilandi.')}}
      else if(action==='all-present'){for(const select of root.querySelectorAll('#attendance-form select[name^="status-"]'))select.value='present';for(const input of root.querySelectorAll('#attendance-form input[name^="skipped-"]'))input.value='0'}
      else if(action==='edit-grade'){state.editGradeId=el.dataset.id;render()}

      else if(action==='json-import-save')await saveJSONImport();else if(action==='json-import-cancel'){state.jsonImportPending=null;state.jsonImportMode='';state.jsonImportPreview=null;render()}

    })().catch(e=>notify(`Xatolik: ${e.message}`))});
    root.addEventListener('change',event=>{const el=event.target;if(el.id==='attendance-date'){if(isDate(el.value)){state.attendanceDate=el.value;render()}else notify('Sanani tekshiring.')}else if(el.id==='grade-date'){if(isDate(el.value)){state.gradeDate=el.value;render()}else notify('Sanani tekshiring.')}else if(el.id==='grade-subject'){state.gradeSubject=el.value;render()}else if(el.id==='rating-week'){state.ratingWeek=el.value;render()}else if(el.id==='read-curriculum-grade'){state.curriculumGrade=Number(el.value);render()}else if(el.id==='schedule-class'){state.scheduleClassId=el.value;render()}else if(el.id==='json-import-mode'){state.jsonImportMode=el.value;try{state.jsonImportPreview=el.value?buildJSONImportPlan(state.jsonImportPending,el.value):null;render()}catch(error){notify(`JSON tekshiruvi amalga oshmadi: ${error.message}`)}}else if(el.id==='import-json'&&el.files?.[0]){importJSON(el.files[0]);el.value=''}else if(el.id==='import-csv'&&el.files?.[0]){importGradesCSV(el.files[0]);el.value=''}else if(el.id==='import-curriculum'&&el.files?.[0]){importCurriculumCSV(el.files[0]);el.value=''}});

    // ===== Browser-console self tests =====
    window.runRatingTests=function(){
      const base={settings:{weights:{avgMultiplier:20,unexcusedAbsencePenalty:3,skippedLessonPenalty:2}},students:[],grades:[],attendance:[]};const checks=[];const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);const test=(name,fn)=>{try{fn();checks.push({test:name,result:'OK'})}catch(e){checks.push({test:name,result:'XATO',detail:e.message})}};
      test('Baholar bo‘lmasa o‘rtacha baho null va ball 0',()=>{const d={...base,students:[{id:'a',fullName:'Ali'}]};const r=calculateRatings(d,'2026-10-12')[0];if(r.avg!==null||r.score!==0)throw Error(JSON.stringify(r))});
      test('Teng ballarda tartib: o‘rtacha baho, so‘ng ism',()=>{const d={...base,students:[{id:'z',fullName:'Zebo'},{id:'b',fullName:'Botir'},{id:'a',fullName:'Ali'}],grades:[{studentId:'z',date:'2026-10-12',value:4},{studentId:'b',date:'2026-10-12',value:4},{studentId:'a',date:'2026-10-12',value:4}]};const r=calculateRatings(d,'2026-10-12');if(!eq(r.map(x=>x.fullName),['Ali','Botir','Zebo'])||!eq(r.map(x=>x.rank),[1,2,3]))throw Error(JSON.stringify(r))});
      test('Ishlangan misol 83 ball',()=>{const d={...base,students:[{id:'a',fullName:'Ali'}],grades:[{studentId:'a',date:'2026-10-12',value:4},{studentId:'a',date:'2026-10-13',value:5}],attendance:[{studentId:'a',date:'2026-10-12',status:'unexcused',skippedLessons:2}]};const r=calculateRatings(d,'2026-10-12')[0];if(r.avg!==4.5||r.score!==83)throw Error(JSON.stringify(r))});
      test('Faqat sababli kelmagan kun jarima bermaydi',()=>{const d={...base,students:[{id:'a',fullName:'Ali'}],attendance:[{studentId:'a',date:'2026-10-12',status:'excused',skippedLessons:0}]};const r=calculateRatings(d,'2026-10-12')[0];if(r.unexcusedDays!==0||r.score!==0)throw Error(JSON.stringify(r))});
      console.table(checks);return checks;
    };
    window.runCurriculumTests=function(){
      const checks=[],eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b),test=(name,fn)=>{try{fn();checks.push({test:name,result:'OK'})}catch(e){checks.push({test:name,result:'XATO',detail:e.message})}};
      test('1-sinf faqat 5–9-sinflarda o‘tiladigan fanni olmaydi',()=>{const id=subjectIdForName('Geometriya');if(curriculumAllows(1,id)||!curriculumAllows(7,id))throw Error('Bosqich bo‘yicha fan filtri noto‘g‘ri.')});
      test('Jadval fan tanlovida faqat shu bosqich rejasidagi fanlar bor',()=>{const options=scheduleSubjectOptions(1,subjectIdForName('Geometriya'));if(options.includes('Geometriya')||!options.includes('Ona tili'))throw Error('Jadval tanlovida reja tashqarisidagi fan ko‘rindi.')});
      test('Migratsiya 5-A sinfni 5-bosqich qiladi, baho va davomatni saqlaydi',()=>{const grades=[{id:'g1',studentId:'s1',subject:'Matematika',value:5,date:'2026-10-12',comment:''}],attendance=[{studentId:'s1',date:'2026-10-12',status:'present',skippedLessons:0}],legacy={version:1,settings:{weights:{avgMultiplier:20,unexcusedAbsencePenalty:3,skippedLessonPenalty:2},gradeMin:2,gradeMax:5,lessonsPerDay:7,showRankingToStudents:false},auth:{teacherUsername:'teacher',teacherPasswordHash:'a'.repeat(64)},classes:[{id:'class-5a',name:'5-A'}],students:[],subjects:['Matematika'],grades,attendance,weeklySnapshots:[]};const migrated=migrateData(legacy);if(migrated.classes[0].grade!==5||!eq(migrated.grades,grades)||!eq(migrated.attendance,attendance))throw Error('Migratsiya mavjud yozuvlarni o‘zgartirdi.')});
      test('Jadvalda ishlatiladigan fanni o‘chirib bo‘lmaydi',()=>{const name='Geometriya',data={grades:[],curriculum:[],timetable:[{subjectId:subjectIdForName(name)}]};if(canDeleteSubject(data,name))throw Error('Jadvaldagi fan o‘chirishga ruxsat berildi.')});
      test('Noto‘g‘ri sinf qatori xabar qilinadi, yaroqli qator qabul qilinadi',()=>{const parsed=parseCurriculumRows([['grade','subject','weekly_hours'],['12','Noma’lum fan',''],['5','Matematika','4']],['Matematika']);if(parsed.errors.length!==1||parsed.valid.length!==1||parsed.valid[0].grade!==5)throw Error(JSON.stringify(parsed))});
      console.table(checks);return checks;
    };
    window.runTimetableTests=function(){
      const checks=[],eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b),test=(name,fn)=>{try{fn();checks.push({test:name,result:'OK'})}catch(e){checks.push({test:name,result:'XATO',detail:e.message})}},rng=()=>0.37;
      test('Migratsiya B, D, E sinflarini yaratadi va takroran ishlaganda o‘zgarmaydi',()=>{const legacy={version:1,settings:{weights:{avgMultiplier:20,unexcusedAbsencePenalty:3,skippedLessonPenalty:2},gradeMin:2,gradeMax:5,lessonsPerDay:7,showRankingToStudents:false},auth:{teacherUsername:'teacher'},classes:GRADES.map(grade=>({id:`class-${grade}-a`,name:`${grade}-A`})),students:[{id:'s1',classId:'class-5-a',fullName:'Ali',username:'ali',passwordHash:'a'.repeat(64)}],subjects:['Matematika'],grades:[{id:'g1',studentId:'s1',subject:'Matematika',value:5,date:'2026-10-12',comment:''}],attendance:[{studentId:'s1',date:'2026-10-12',status:'present',skippedLessons:0}],timetable:[{id:'l1',classId:'class-5-a',day:1,lesson:1,subjectId:subjectIdForName('Matematika')}],weeklySnapshots:[]};const originalGrades=JSON.stringify(legacy.grades),originalAttendance=JSON.stringify(legacy.attendance),first=migrateData(legacy),once=JSON.stringify(first);if(first.classes.length!==44||first.classes.some(c=>!c.grade||!c.section)||!first.classes.some(c=>c.name==='5-A'&&c.grade===5))throw Error('44 sinf yoki 5-A bosqichi noto‘g‘ri.');for(const grade of GRADES)for(const section of STANDARD_SECTIONS)if(first.classes.filter(c=>c.name===`${grade}-${section}`).length!==1)throw Error(`Sinf yetishmaydi yoki takrorlangan: ${grade}-${section}`);migrateData(first);if(JSON.stringify(first)!==once)throw Error('Ikkinchi migratsiya ma’lumotni o‘zgartirdi.');if(JSON.stringify(first.grades)!==originalGrades||JSON.stringify(first.attendance)!==originalAttendance||first.students[0].id!=='s1'||first.timetable[0].weekday!==1||first.timetable[0].lessonNo!==1)throw Error('O‘quvchi, baho, davomat yoki jadval migratsiyada o‘zgardi.')});
      test('Yangi o‘rnatish 44 ta A, B, D, E sinfini beradi',()=>{const classes=defaultClasses();if(classes.length!==44||new Set(classes.map(c=>c.name)).size!==44)throw Error(`${classes.length} sinf topildi.`)});
      test('7 va 5 darsli kunlarda barcha 6 kun kataklari to‘ladi',()=>{const rows=GRADES.slice(0,4).map(grade=>({grade,subjectId:`s${grade}`,weeklyHours:null}));for(const perDay of [7,5]){const result=generateTimetable(1,perDay,rows,rng);if(result.error||result.rows.length!==6*perDay)throw Error(JSON.stringify(result));for(let weekday=1;weekday<=6;weekday++){const day=result.rows.filter(row=>row.weekday===weekday);if(day.length!==perDay||new Set(day.map(row=>row.lessonNo)).size!==perDay)throw Error(`${weekday}-kun darslari soni noto‘g‘ri.`)}}});
      test('Belgilangan haftalik soatlar joylashsa aynan saqlanadi',()=>{const planned=[['ona',4],['mat',3],['tab',5]],result=generateTimetable(5,2,planned.map(([subjectId,weeklyHours])=>({grade:5,subjectId,weeklyHours})),rng);if(result.error||result.warning)throw Error(JSON.stringify(result));for(const [subjectId,hours] of planned)if(result.rows.filter(row=>row.subjectId===subjectId).length!==hours)throw Error(`${subjectId}: reja va jadval soati mos emas.`)});
      test('Imkon bo‘lsa bir kunda bir fan takrorlanmaydi',()=>{const result=generateTimetable(5,2,['ona','mat','tar'].map(subjectId=>({grade:5,subjectId,weeklyHours:4})),rng);if(result.error||result.repeats!==0)throw Error(JSON.stringify(result));for(let weekday=1;weekday<=6;weekday++)if(new Set(result.rows.filter(row=>row.weekday===weekday).map(row=>row.subjectId)).size!==2)throw Error(`${weekday}-kunda takror bor.`)});
      test('Bir darajadagi takror nom qabul qilinmaydi',()=>{const data={classes:[{id:'a',grade:5,name:'5-A',section:'A'}]};if(!classNameExists(data,5,'A')||!classNameExists(data,5,'5-A')||classNameExists(data,5,'B'))throw Error('Sinf nomi tekshiruvi noto‘g‘ri.')});
      test('O‘quvchisi bor sinfni o‘chirish bloklanadi',()=>{const data={students:[{classId:'c'}],timetable:[]},blocked=classDeletionBlock(data,'c');if(blocked.students!==1||blocked.lessons!==0)throw Error(JSON.stringify(blocked))});
      test('Mavjud jadval ustiga yozishdan oldin tasdiq so‘raladi',()=>{let prompt='';const accepted=confirmRandomTimetableOverwrite([{id:'1'},{id:'2'}],message=>{prompt=message;return false});if(accepted||!prompt.includes('2 ta'))throw Error('Mavjud darslar uchun tasdiq so‘ralmadi.')});
      test('Soatlar sig‘masa kamaytirish ogohlantirishi qaytadi',()=>{const rows=Array.from({length:8},(_,i)=>({grade:1,subjectId:`overflow-${i}`,weeklyHours:12})),result=generateTimetable(1,1,rows,rng);if(result.warning!=='Soatlar sig‘madi, ayrim fanlar kamaytirildi'||result.rows.length!==6)throw Error(JSON.stringify(result))});
      console.table(checks);return checks;
    };
    window.__sinfDaftari={getData:()=>state.db,calculateRatings,runRatingTests:window.runRatingTests,runCurriculumTests:window.runCurriculumTests,runTimetableTests:window.runTimetableTests,generateTimetable,migrateData,ensureStandardSections,defaultClasses,classNameExists,classDeletionBlock,confirmRandomTimetableOverwrite};

    (async()=>{try{state.db=await loadData();validateData(state.db);await render()}catch(error){root.innerHTML=`<div class="login-page"><div class="login-panel"><div class="login-card"><h2>Ma’lumotni ochib bo‘lmadi</h2><p>${esc(error.message)}</p><p class="small muted">Brauzerning mahalliy xotirasi mavjudligini tekshiring.</p></div></div></div>`}})();
  })();
